name: KINTAI SRS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deterministic-verification:
    name: Build & Deterministic Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile C# Linter and Regression Suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) {
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          if (-not (Test-Path $csc)) {
            throw "C# compiler (csc.exe) not found."
          }
          & $csc /nologo /target:exe /out:tools\scripts\VerifySRS.exe tools\scripts\VerifySRS.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /target:exe /out:tools\scripts\TestV52Suite_Regression.exe tools\scripts\TestV52Suite_Regression.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Deterministic Regression Testbed (11/11)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\scripts\TestV52Suite_Regression.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run VerifySRS Linter and Bidirectional Parity Gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath 'config/srs_targets.json' -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          $entries = if ($config -and $config.PSObject.Properties['targets']) { $config.targets } else { $config }
          $targets = @($entries | Where-Object { $_.required -is [bool] -and $_.required })
          if ($targets.Count -eq 0) {
            throw 'No required SRS targets found in config/srs_targets.json.'
          }

          # 1. Physical existence validation
          foreach ($t in $targets) {
            if ([string]::IsNullOrWhiteSpace($t.ja_path)) {
              throw 'A required target in config/srs_targets.json has no ja_path.'
            }
            if (-not (Test-Path -LiteralPath $t.ja_path -PathType Leaf)) {
              throw "Required SRS target file is missing: $($t.ja_path)"
            }
          }

          # 2. Bidirectional Parity Gate (Set(Disk) == Set(JSON))
          $diskSlices = @(Get-ChildItem -Path 'config' -Filter 'srs_track2_asbuilt_slice*.md' | Where-Object { $_.Name -notmatch '_KO\.md$' } | ForEach-Object {
            (Resolve-Path $_.FullName).Path.Replace('\', '/').ToLowerInvariant()
          })
          $jsonSlices = @($targets | Where-Object { $_.ja_path -match 'srs_track2_asbuilt_slice' } | ForEach-Object {
            (Resolve-Path $_.ja_path).Path.Replace('\', '/').ToLowerInvariant()
          })

          $orphans = @($diskSlices | Where-Object { $_ -notin $jsonSlices })
          if ($orphans.Count -gt 0) {
            throw "[FAIL-CLOSED] [KINTAI-E-SLICE-001] Orphan slice file(s) on disk not registered in srs_targets.json: $($orphans -join ', ')"
          }
          $dangling = @($jsonSlices | Where-Object { $_ -notin $diskSlices })
          if ($dangling.Count -gt 0) {
            throw "[FAIL-CLOSED] [KINTAI-E-SLICE-002] Dangling slice target(s) registered in srs_targets.json missing from disk: $($dangling -join ', ')"
          }

          # 3. Unauthorized Deletion Check (git diff --diff-filter=D)
          $deletedSpecs = @(git log -1 --diff-filter=D --name-only --pretty="" -- 'config/srs_*.md')
          if ($deletedSpecs.Count -gt 0) {
            $lastCommitMsg = (git log -1 --pretty="%B")
            if ($lastCommitMsg -notmatch '(?i)\[ALLOW_RETIRE\]') {
              throw "[FAIL-CLOSED] [KINTAI-E-SLICE-005] Unauthorized deletion of specification file without [ALLOW_RETIRE]: $($deletedSpecs -join ', ')"
            }
          }

          # 4. VerifySRS Linter execution
          $firstFailure = 0
          foreach ($t in $targets) {
            Write-Host "Verifying $($t.ja_path) ..."
            & .\tools\scripts\VerifySRS.exe $t.ja_path
            $lintExit = $LASTEXITCODE
            if ($lintExit -ne 0 -and $firstFailure -eq 0) {
              $firstFailure = $lintExit
            }
          }
          if ($firstFailure -ne 0) {
            exit $firstFailure
          }

      - name: Run Zero-Korean, UTF-8 BOM, and PowerShell Syntax Gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $koreanPattern = '[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F\uA960-\uA97F\uD7B0-\uD7FF\uFFA0-\uFFDC]'
          $tracked = git ls-files
          $failures = 0

          foreach ($f in $tracked) {
            if (-not (Test-Path $f)) { continue }
            if ($f -match '\.(exe|dll|png|jpg|ico)$') { continue }

            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f).Path)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              Write-Host "[BOM ERROR] $f contains UTF-8 BOM"
              $failures++
            }

            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            if ($text -match $koreanPattern) {
              Write-Host "[KOREAN ERROR] $f contains Korean characters"
              $failures++
            }

            if ($f -match '\.ps1$') {
              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseInput($text, (Resolve-Path $f).Path, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                Write-Host "[PS SYNTAX ERROR] $f : $($parseErrors[0].Message)"
                $failures++
              }
            }
          }

          if ($failures -gt 0) {
            throw "Static repository gate failed with $failures violation(s)."
          }
          Write-Host "PASS: Zero-Korean, Zero-BOM, and PowerShell syntax checks succeeded across $($tracked.Count) files."

      - name: Run Master Repository Total Integrity Gate (11/11 Full Gates)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\scripts\verify_repo_total_integrity.ps1 -NoLog
          if ($LASTEXITCODE -ne 0) {
            throw "Repository Total Integrity Verification failed (ExitCode: $LASTEXITCODE)."
          }
